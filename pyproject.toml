[project]
name = "project-relay"
version = "1.0.0"
description = "Multi-tenant, human-gated support desk agents on local models (LangGraph + Ollama + Postgres/pgvector)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph==1.2.18",
    "langgraph-checkpoint==4.3.1",
    "langgraph-checkpoint-postgres==3.2.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pgvector==0.5.1",
    "numpy==2.3.3",
    "pydantic==2.11.9",
    "pydantic-settings==2.10.1",
    "httpx==0.28.1",
    "fastapi==0.118.0",
    "uvicorn==0.37.0",
    "alembic==1.16.5",
    "sqlalchemy==2.0.43",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[project.scripts]
relay = "relay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
